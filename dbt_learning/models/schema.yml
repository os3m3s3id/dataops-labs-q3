version: 2

models:
  - name: dim_customers
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
        
          
  - name: dim_products
    columns:
      - name: product_id
        tests:
          - unique
          - not_null


  - name: dim_stores
    columns:
      - name: store_id
        tests:
          - unique
          - not_null


  - name: stg_orders
    columns:
      - name: order_id
        tests:
          - unique
          - not_null


  - name: fct_order_items
    columns:
      - name: order_item_id
        tests:
          - not_null
      - name: product_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
              config:
                severity: warn
      - name: customer_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
              config:
                severity: warn